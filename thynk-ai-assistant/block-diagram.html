<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Assistive Stick for Blind People – Block Diagram</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: linear-gradient(135deg, #0a192f, #1e3a8a);
      font-family: "Segoe UI", "Poppins", sans-serif;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 16px 40px;
    }

    h1 {
      font-size: clamp(1.2rem, 3vw, 1.8rem);
      text-align: center;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
      color: #f0f9ff;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #93c5fd;
      margin-bottom: 28px;
      text-align: center;
    }

    .diagram-wrapper {
      width: 100%;
      max-width: 900px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 20px;
      overflow-x: auto;
    }

    svg {
      display: block;
      margin: 0 auto;
      overflow: visible;
    }

    /* ── boxes ── */
    .box {
      rx: 8;
      ry: 8;
      stroke-width: 2;
    }

    /* central MCU */
    .mcu-rect  { fill: #1e40af; stroke: #60a5fa; }
    .mcu-text  { fill: #e0f2fe; font-weight: 700; }

    /* sensors */
    .sensor-rect  { fill: #065f46; stroke: #34d399; }
    .sensor-text  { fill: #d1fae5; }

    /* communication */
    .comm-rect  { fill: #7c3aed; stroke: #c4b5fd; }
    .comm-text  { fill: #ede9fe; }

    /* output */
    .output-rect  { fill: #b45309; stroke: #fcd34d; }
    .output-text  { fill: #fef9c3; }

    /* power */
    .power-rect  { fill: #991b1b; stroke: #fca5a5; }
    .power-text  { fill: #fee2e2; }

    /* arrows */
    .arrow {
      stroke: #94a3b8;
      stroke-width: 2;
      fill: none;
      marker-end: url(#arrowhead);
    }
    .arrow-bi {
      stroke: #94a3b8;
      stroke-width: 2;
      fill: none;
      marker-end: url(#arrowhead);
      marker-start: url(#arrowhead-rev);
    }

    text {
      font-family: "Segoe UI", "Poppins", sans-serif;
      font-size: 12px;
    }
    .label-small { font-size: 10px; fill: #94a3b8; }

    /* legend */
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 20px;
      margin-top: 22px;
      justify-content: center;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: #cbd5e1;
    }
    .legend-box {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      border: 2px solid;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <h1>🦯 Smart Assistive Stick for Blind People</h1>
  <p class="subtitle">System Block Diagram</p>

  <div class="diagram-wrapper">
    <!--
      SVG canvas: 860 × 560
      Layout (approximate centres):
        Battery            : (430, 40)
        Arduino Nano (MCU) : (430, 200)  ← centre
        HC-SR04 #1 (Left)  : (100, 200)
        HC-SR04 #2 (Right) : (760, 200)
        GPS NEO-6M         : (100, 370)
        SIM800L            : (760, 370)
        Buzzer             : (280, 370)
        Push Button (SOS)  : (430, 370)
        Water Sensor       : (580, 370)
    -->
    <svg viewBox="0 0 860 520" width="820" height="490"
         xmlns="http://www.w3.org/2000/svg" aria-label="Block diagram of Smart Assistive Stick">

      <defs>
        <marker id="arrowhead" markerWidth="8" markerHeight="6"
                refX="8" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#94a3b8" />
        </marker>
        <marker id="arrowhead-rev" markerWidth="8" markerHeight="6"
                refX="0" refY="3" orient="auto">
          <polygon points="8 0, 0 3, 8 6" fill="#94a3b8" />
        </marker>
      </defs>

      <!-- ══════════════ POWER SUPPLY ══════════════ -->
      <rect class="box power-rect" x="340" y="14" width="180" height="52" />
      <text class="power-text" x="430" y="35" text-anchor="middle" font-size="13" font-weight="700" fill="#fee2e2">🔋 Power Supply</text>
      <text class="label-small" x="430" y="52" text-anchor="middle">18650 Li-ion Battery</text>

      <!-- power → MCU arrow -->
      <line class="arrow" x1="430" y1="66" x2="430" y2="152" />
      <text class="label-small" x="437" y="110" text-anchor="start">5 V / 3.3 V</text>

      <!-- ══════════════ ARDUINO NANO (MCU) ══════════════ -->
      <rect class="box mcu-rect" x="310" y="152" width="240" height="72" />
      <text class="mcu-text" x="430" y="178" text-anchor="middle" font-size="14" font-weight="700">⚙️ Arduino Nano</text>
      <text class="mcu-text" x="430" y="196" text-anchor="middle" font-size="11">(Central Controller)</text>
      <text class="label-small" x="430" y="215" text-anchor="middle">ATmega328P @ 16 MHz</text>

      <!-- ══════════════ HC-SR04 #1 (LEFT) ══════════════ -->
      <rect class="box sensor-rect" x="20" y="152" width="180" height="60" />
      <text class="sensor-text" x="110" y="175" text-anchor="middle" font-size="12" font-weight="600">📡 HC-SR04</text>
      <text class="sensor-text" x="110" y="192" text-anchor="middle" font-size="11">Ultrasonic Sensor #1</text>
      <text class="label-small" x="110" y="208" text-anchor="middle">(Left / Front)</text>

      <!-- HC-SR04 #1 ↔ MCU -->
      <line class="arrow-bi" x1="200" y1="182" x2="310" y2="182" />

      <!-- ══════════════ HC-SR04 #2 (RIGHT) ══════════════ -->
      <rect class="box sensor-rect" x="660" y="152" width="180" height="60" />
      <text class="sensor-text" x="750" y="175" text-anchor="middle" font-size="12" font-weight="600">📡 HC-SR04</text>
      <text class="sensor-text" x="750" y="192" text-anchor="middle" font-size="11">Ultrasonic Sensor #2</text>
      <text class="label-small" x="750" y="208" text-anchor="middle">(Right / Ground)</text>

      <!-- HC-SR04 #2 ↔ MCU -->
      <line class="arrow-bi" x1="660" y1="182" x2="550" y2="182" />

      <!-- ══════════════ BOTTOM ROW (5 blocks) ══════════════ -->

      <!-- GPS NEO-6M -->
      <rect class="box comm-rect" x="20" y="360" width="160" height="60" />
      <text class="comm-text" x="100" y="383" text-anchor="middle" font-size="12" font-weight="600">🛰️ GPS Module</text>
      <text class="comm-text" x="100" y="400" text-anchor="middle" font-size="11">NEO-6M</text>
      <text class="label-small" x="100" y="416" text-anchor="middle">Location Tracking</text>

      <!-- GPS ↔ MCU  (via UART) -->
      <path class="arrow-bi" d="M100 360 Q100 280 310 224" />
      <text class="label-small" x="168" y="300" text-anchor="middle" transform="rotate(-20,168,300)">UART (TX/RX)</text>

      <!-- Buzzer -->
      <rect class="box output-rect" x="215" y="360" width="130" height="60" />
      <text class="output-text" x="280" y="383" text-anchor="middle" font-size="12" font-weight="600">🔊 Buzzer</text>
      <text class="output-text" x="280" y="400" text-anchor="middle" font-size="11">Audio Alert</text>
      <text class="label-small" x="280" y="416" text-anchor="middle">Obstacle Warning</text>

      <!-- Buzzer ← MCU -->
      <line class="arrow" x1="380" y1="224" x2="280" y2="360" />

      <!-- Push Button (SOS) -->
      <rect class="box sensor-rect" x="375" y="360" width="110" height="60" />
      <text class="sensor-text" x="430" y="381" text-anchor="middle" font-size="12" font-weight="600">🆘 Push Button</text>
      <text class="sensor-text" x="430" y="398" text-anchor="middle" font-size="11">SOS / Emergency</text>
      <text class="label-small" x="430" y="414" text-anchor="middle">Digital Input</text>

      <!-- Push Button → MCU -->
      <line class="arrow" x1="430" y1="360" x2="430" y2="224" />

      <!-- Water / Rain Sensor -->
      <rect class="box sensor-rect" x="515" y="360" width="130" height="60" />
      <text class="sensor-text" x="580" y="381" text-anchor="middle" font-size="12" font-weight="600">💧 Water Sensor</text>
      <text class="sensor-text" x="580" y="398" text-anchor="middle" font-size="11">Rain / Wet Surface</text>
      <text class="label-small" x="580" y="414" text-anchor="middle">Analog Input</text>

      <!-- Water Sensor → MCU -->
      <line class="arrow" x1="580" y1="360" x2="480" y2="224" />

      <!-- SIM800L -->
      <rect class="box comm-rect" x="680" y="360" width="160" height="60" />
      <text class="comm-text" x="760" y="383" text-anchor="middle" font-size="12" font-weight="600">📱 SIM800L</text>
      <text class="comm-text" x="760" y="400" text-anchor="middle" font-size="11">GSM Module</text>
      <text class="label-small" x="760" y="416" text-anchor="middle">SMS / Emergency Call</text>

      <!-- SIM800L ↔ MCU (via Software UART) -->
      <path class="arrow-bi" d="M760 360 Q760 280 550 224" />
      <text class="label-small" x="692" y="300" text-anchor="middle" transform="rotate(20,692,300)">Soft UART</text>

      <!-- ══════════════ SECTION LABELS ══════════════ -->
      <text x="110" y="143" text-anchor="middle" font-size="10" fill="#6ee7b7">INPUT — SENSING</text>
      <text x="750" y="143" text-anchor="middle" font-size="10" fill="#6ee7b7">INPUT — SENSING</text>
      <text x="100" y="352" text-anchor="middle" font-size="10" fill="#c4b5fd">COMMUNICATION</text>
      <text x="760" y="352" text-anchor="middle" font-size="10" fill="#c4b5fd">COMMUNICATION</text>
      <text x="280" y="352" text-anchor="middle" font-size="10" fill="#fcd34d">OUTPUT</text>
      <text x="430" y="352" text-anchor="middle" font-size="10" fill="#6ee7b7">INPUT</text>
      <text x="580" y="352" text-anchor="middle" font-size="10" fill="#6ee7b7">INPUT — SENSING</text>

      <!-- flow direction hint -->
      <text x="430" y="500" text-anchor="middle" font-size="11" fill="#64748b">
        ← → Bidirectional data   →  Unidirectional data / control
      </text>
    </svg>
  </div>

  <!-- Legend -->
  <div class="legend">
    <div class="legend-item">
      <div class="legend-box" style="background:#1e40af;border-color:#60a5fa;"></div>
      Microcontroller (MCU)
    </div>
    <div class="legend-item">
      <div class="legend-box" style="background:#065f46;border-color:#34d399;"></div>
      Sensors / Input
    </div>
    <div class="legend-item">
      <div class="legend-box" style="background:#7c3aed;border-color:#c4b5fd;"></div>
      Communication Modules
    </div>
    <div class="legend-item">
      <div class="legend-box" style="background:#b45309;border-color:#fcd34d;"></div>
      Output / Actuator
    </div>
    <div class="legend-item">
      <div class="legend-box" style="background:#991b1b;border-color:#fca5a5;"></div>
      Power Supply
    </div>
  </div>
</body>
</html>
